[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitna"
dynamic = ["version"]
description = "Hinglish and Devanagari quantities, money, times and dates to exact canonical values, with explicit ambiguity flags."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["hinglish", "hindi", "number-parsing", "nlp", "devanagari"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Natural Language :: Hindi",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "pytest-cov", "ruff", "mypy"]

[tool.hatch.version]
path = "src/kitna/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kitna"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["kitna"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
