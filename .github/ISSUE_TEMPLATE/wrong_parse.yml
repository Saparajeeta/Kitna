name: Wrong or missing parse
description: Kitna returned the wrong value, missed something, or saw a number that is not there
labels: [parse]
body:
  - type: input
    id: text
    attributes: {label: Input text, description: Exactly what you typed}
    validations: {required: true}
  - type: input
    id: call
    attributes: {label: How you called it, placeholder: 'kitna parse "..." --base 2026-11-12'}
  - type: textarea
    id: got
    attributes: {label: What Kitna returned}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected, and why (how would a speaker read it?)}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, placeholder: kitna --version}
