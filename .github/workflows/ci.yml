name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python scripts/validate_cases.py
      - run: python scripts/gen_policy_docs.py --check
      - run: pytest -q --cov --cov-report=term
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,bench]"
      - run: mypy src bench/kitna_bench
      - name: Item files validate and generated files are current
        run: |
          python scripts/bench.py validate bench/items/*.jsonl
          python scripts/bench.py seed --check
          python scripts/bench.py drafts --check
      - name: Held-out set unchanged since it was frozen
        run: python scripts/bench.py heldout check
      - run: pytest -q tests/bench
      - name: Mock-adapter fixture run (offline, end to end)
        run: |
          python scripts/bench.py run --models bench/models.mock.yaml --out "$RUNNER_TEMP/mock-run" --samples 3
          test -s "$RUNNER_TEMP/mock-run/summary.md"
          python scripts/bench.py leaderboard --out "$RUNNER_TEMP/leaderboard.html"
      - name: Every claim links to a results file
        run: python scripts/check_claims.py
  apps:
    name: demo, HTTP service, live comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,demo,serve,compare]" httpx
      - run: mypy src demo
      - run: pytest -q tests/test_demo.py tests/test_demo_app.py tests/test_server.py tests/test_cli_serve.py tests/test_toolcall.py
      - name: The offline tool-call example runs
        run: python examples/tool_call_guard.py
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/kitna parse "dhai lakh" && /tmp/clean/bin/python -c "import kitna; print(kitna.__version__)"
