# Publishes to PyPI with trusted publishing (OIDC): no API token is stored anywhere.
# One-time setup by the project owner, on pypi.org -> Your account -> Publishing ->
# "Add a pending publisher":  PyPI project name: kitna, owner: Saparajeeta,
# repository: Kitna, workflow: release.yml, environment: pypi.
# Then push a tag such as v0.1.0.dev0 whose version matches src/kitna/__init__.py.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Tag must match the package version
        run: |
          python -m pip install dist/*.whl
          test "v$(python -c 'import kitna; print(kitna.__version__)')" = "${GITHUB_REF_NAME}"
      - name: Tests against the built wheel
        run: |
          python -m pip install pytest hypothesis jsonschema
          cd tests && python -m pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
